<div class="header-left">
  <button
    class="menu-btn"
    ng-click="toggleSidebar()"
    aria-label="Toggle navigation menu"
  >
    ☰
  </button>

  <div class="logo">
    <img src="../images/logo.png" alt="SkillSync Logo" class="logo-icon" />
    <span class="logo-text">skillsync</span>
  </div>
</div>

<!-- Search -->
<div class="search-box">
  <span aria-hidden="true">⌕</span>
  <input
    type="text"
    placeholder="Search skills, students..."
    ng-model="searchText"
    aria-label="Search skills and students"
  />
</div>

<!-- Header Right -->
<div class="header-right">
  <button class="header-icon" aria-label="Notifications">🔔</button>
  <button class="header-icon" aria-label="Messages">💬</button>

  <div class="token-display">
    <span aria-hidden="true">🪙</span>
    <strong>{{ tokens }}</strong>
  </div>

  <div class="profile-menu" ng-click="toggleProfileMenu()">
    <div class="profile-picture" aria-hidden="true">
      {{ currentUser.initial }}
    </div>
    <span class="profile-name">{{ currentUser.name }}</span>
    <span class="arrow" aria-hidden="true">⌄</span>

    <div class="profile-dropdown" ng-show="profileOpen">
      <div class="profile-info">
        <strong>{{ currentUser.name }}</strong>
        <span>{{ currentUser.email }}</span>
      </div>
      <hr />
      <a href="profile.html">👤 My Profile</a>
      <a href="settings.html">⚙ Settings</a>
      <a href="#" ng-click="logout(); $event.stopPropagation()">↪ Sign Out</a>
    </div>
  </div>
</div>
